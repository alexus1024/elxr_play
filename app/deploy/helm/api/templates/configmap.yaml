apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: {{ .Release.Namespace }}
data:
  API_PORT: {{ .Values.config.port | quote }}
  API_DEBUG: {{ .Values.config.debug | quote }}
  API_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  API_MAX_COUNTER: {{ .Values.config.maxCounter | quote }}
  API_INIT_COUNTER: {{ .Values.config.initCounter | quote }}
  API_COUNTER_RESPONSE_DELAY: {{ .Values.config.counterResponseDelay | quote }}
  API_NATS_URL: {{ .Values.config.natsUrl | quote }}
