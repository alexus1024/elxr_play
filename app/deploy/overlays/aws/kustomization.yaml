# Deploy to AWS EKS.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: api
    patch: |-
      - op: remove
        path: /spec/ports/0/nodePort
      - op: replace
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

images:
  - name: alexus_test_apps/elxr_rp5/api
    newName: 306607894964.dkr.ecr.ca-central-1.amazonaws.com/api
    newTag: latest

